<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>眼维 · 托管管理</title><style>body{background:#111827;color:#eee;max-width:760px;margin:60px auto;font:17px/1.9 system-ui}a{color:#82dada}button{padding:12px;font:inherit}</style><h1>眼维统一托管</h1><p>管理员在本机配置一次，访客使用同一个智能体，无需 Nexent 账号或模型密钥。</p><p>先在 <a href="/integration">首次设置</a> 完成模型和智能体配置，再点击下方按钮。已有 API Key 会复用；不会刷新已有密钥。</p><button id="enable">连接当前已配置智能体，启用访客服务</button><pre id="status"></pre><p>本机访客入口：<a href="http://localhost:18881/console">http://localhost:18881/console</a></p><p>这个页面只供管理员本机访问。公网域名仅转发访客入口，不转发 Nexent 或此页面。</p><script>document.querySelector('#enable').onclick=async e=>{e.target.disabled=true;try{const r=await fetch('/api/integration/hosting',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();document.querySelector('#status').textContent=r.ok?'配置完成，访客无需登录 Nexent。':d.error?.message||'配置失败'}catch{document.querySelector('#status').textContent='连接失败，请检查后台服务'}finally{e.target.disabled=false}}</script></html>
