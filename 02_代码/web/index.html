<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>眼维 · 眼底跨模态检索与证据复核</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --line:#e4e8f2; --ink:#1b1d29; --sub:#6a7086;
    --brand:#4f5dff; --brand-soft:#eef0ff;
    --ret:#0d7a45; --ret-bg:#e6f7ee;
    --ask:#9a6700; --ask-bg:#fff5e0;
    --abs:#b4232b; --abs-bg:#fdecec;
    --ref:#5b34c9; --ref-bg:#f0e9ff;
    --qc:#1c4fb8; --qc-bg:#eaf1ff;
    --ok:#0d7a45; --warn:#9a6700; --bad:#b4232b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  header{background:linear-gradient(135deg,#4f5dff,#7b5cff);color:#fff;padding:20px 28px}
  header h1{margin:0;font-size:19px;letter-spacing:.3px}
  header .meta{font-size:12.5px;opacity:.9;margin-top:4px;font-variant-numeric:tabular-nums}
  main{max-width:1120px;margin:20px auto 60px;padding:0 18px;display:flex;flex-direction:column;gap:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;box-shadow:0 4px 18px rgba(20,24,60,.05)}
  .panel h2{margin:0 0 12px;font-size:14px;color:#4a5170;
    border-left:3px solid var(--brand);padding-left:9px;font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  textarea{width:100%;min-height:76px;resize:vertical;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fbfcff}
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  input[type=text]{padding:9px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:13px;font-family:inherit;outline:none;flex:1;min-width:200px;background:#fbfcff}
  button{border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:.15s;background:var(--brand);color:#fff}
  button:hover{filter:brightness(1.07)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:var(--brand-soft);color:var(--brand)}
  button.mini{padding:5px 11px;font-size:12px;background:#f0f2f9;color:#4a5170}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:#f2f4fb;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    font-size:12.5px;cursor:pointer;color:#3d4463;transition:.15s}
  .chip:hover{background:var(--brand-soft);border-color:#c9cfff;color:var(--brand)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .badge{display:inline-block;padding:5px 13px;border-radius:999px;font-weight:700;font-size:13.5px}
  .b-RETURN_CASES{background:var(--ret-bg);color:var(--ret)}
  .b-ASK_MORE{background:var(--ask-bg);color:var(--ask)}
  .b-ABSTAIN{background:var(--abs-bg);color:var(--abs)}
  .b-SUGGEST_REFERRAL{background:var(--ref-bg);color:var(--ref)}
  .b-RETAKE_IMAGE{background:var(--qc-bg);color:var(--qc)}
  .b-GRADABLE{background:var(--ret-bg);color:var(--ret)}
  .b-DOWNGRADE{background:var(--ask-bg);color:var(--ask)}
  .b-RETAKE{background:var(--abs-bg);color:var(--abs)}
  .b-UNASSESSED{background:#eef0f5;color:#6a7086}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #eef1f7;padding:8px 9px;text-align:left;vertical-align:top}
  th{background:#fafbff;color:#5b6180;font-weight:600;white-space:nowrap}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .muted{color:var(--sub);font-size:12.5px}
  .kvs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .kv{background:#f6f8fd;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px}
  .kv b{color:#3d4463}
  .reasons{margin:9px 0 0;padding-left:19px;font-size:13px;color:#464d6b}
  .reasons li{margin:2px 0}
  .action-line{font-size:15px;margin:10px 0 4px}
  iframe{width:100%;height:620px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .log{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#0f1225;color:#c9d2ff;
    border-radius:10px;padding:13px;max-height:280px;overflow:auto;white-space:pre-wrap}
  .step{display:flex;gap:9px;padding:5px 0;border-bottom:1px dashed #eef1f7;font-size:12.5px}
  .step .sk{min-width:74px;color:#7a80a0;font-family:ui-monospace,monospace}
  .step .sn{font-weight:600;color:#3d4463;min-width:190px}
  .empty{color:#9aa0b4;font-size:13px;padding:14px 0}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>眼维 · 眼底跨模态检索与证据复核</h1>
  <div class="meta" id="verline">正在读取版本信息…</div>
</header>

<main>
  <!-- ① 输入 -->
  <section class="panel">
    <h2>① 输入 · 一句病灶描述（或带一张眼底图）</h2>
    <textarea id="q" placeholder="例如：右眼黄斑区散在微血管瘤"></textarea>
    <div class="row" style="margin-top:10px">
      <input type="text" id="img" placeholder="可选：填入眼底图像路径（.png 零依赖；.jpg 需装 Pillow）">
      <button id="runBtn">运行决策</button>
    </div>
    <div class="chips" id="samples"></div>
    <div class="hint">四个演示样例各对应一个决策动作，点一下就能看到「动作不是模型决定的，是代码算出来的」。</div>
  </section>

  <div class="grid2">
    <!-- ② 质检 -->
    <section class="panel">
      <h2>② 图像质检结论</h2>
      <div id="qcBox"><div class="empty">未提供图像（走纯文本线）；或运行后在此显示三档结论。</div></div>
    </section>
    <!-- ③ 决策 -->
    <section class="panel">
      <h2>③ 决策动作</h2>
      <div id="decBox"><div class="empty">运行后在此显示唯一一个决策动作与依据。</div></div>
    </section>
  </div>

  <!-- ④ 候选 -->
  <section class="panel">
    <h2>④ 候选先例（含五维画像与分数拆解）</h2>
    <div id="candBox"><div class="empty">运行后在此显示候选区域。</div></div>
  </section>

  <!-- ⑤ 证据卡 -->
  <section class="panel">
    <h2>⑤ 证据卡（每个字段可溯源到数据行）</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="ghost" id="dlJson" disabled>下载证据卡 JSON</button>
      <button class="ghost" id="dlHtml" disabled>下载证据卡 HTML</button>
      <button class="mini" id="fbAccept" disabled>标记：采纳</button>
      <button class="mini" id="fbReject" disabled>标记：驳回</button>
      <span class="muted" id="fbMsg"></span>
    </div>
    <div id="cardBox"><div class="empty">运行后在此显示证据卡（可离线打开的自包含 HTML）。</div></div>
  </section>

  <!-- ⑥ 留痕 -->
  <section class="panel">
    <h2>⑥ 编排轨迹（回放本次决策全程）</h2>
    <div id="traceBox"><div class="empty">运行后在此显示 9 段状态机的每一步。</div></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let LAST = null;

async function api(path, body) {
  const opt = body === undefined ? undefined : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  return r.json();
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function boot() {
  const h = await api("/api/health");
  $("#verline").textContent = `阈值 ${h.threshold_ver} ｜ 规则 ${h.rule_ver} ｜ 模型 ${h.model_ver} ｜ 配置指纹 ${h.fingerprint} ｜ 工具 ${h.tools.length} 个`;
  const s = await api("/api/samples");
  $("#samples").innerHTML = s.samples.map(x =>
    `<span class="chip" data-text="${esc(x.text)}" title="预期动作：${x.expect}">${esc(x.label)}</span>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("#q").value = c.dataset.text; run(); });
}

function renderQc(qc) {
  if (!qc) { $("#qcBox").innerHTML = '<div class="empty">本次未提供图像，跳过质检（走纯文本线）。</div>'; return; }
  const m = qc.metrics || {};
  const rows = Object.entries(m).map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td class="num">${esc(v)}</td></tr>`).join("");
  const rs = (qc.reasons || []).map(r => `<li>${esc(r)}</li>`).join("") || "<li class='muted'>无异常项</li>";
  $("#qcBox").innerHTML = `
    <span class="badge b-${esc(qc.label)}">${esc(qc.label)}</span>
    <span class="muted" style="margin-left:8px">质量分 ${esc(qc.score)}</span>
    <ul class="reasons">${rs}</ul>
    <details style="margin-top:10px"><summary class="muted">五项指标原始值</summary>
      <table style="margin-top:8px"><tr><th>指标</th><th>值</th></tr>${rows}</table></details>`;
}

function renderDecision(r) {
  if (!r.action) { $("#decBox").innerHTML = '<div class="empty">无动作。</div>'; return; }
  const override = r.overridden ? '<span class="muted">（已由代码强制改写）</span>' : "";
  const logic = r.logic || {};
  const conf = (logic.conflicts || []).map(c =>
    `<li><b>${esc(c.severity)}</b> · ${esc(c.message)}</li>`).join("") || "<li class='muted'>无冲突</li>";
  const pd = logic.per_dimension ? Object.entries(logic.per_dimension).map(([k, v]) =>
    `<tr><td class="muted">${esc(k)}</td><td>${esc(v.query ?? "—")}</td><td>${esc(v.candidate ?? "—")}</td>
     <td>${esc(v.verdict)}</td></tr>`).join("") : "";
  $("#decBox").innerHTML = `
    <span class="badge b-${esc(r.action)}">${esc(r.action_label || r.action)}</span>${override}
    <div class="action-line">${esc(r.action_reason || "")}</div>
    <div class="kvs">
      <span class="kv"><b>判定方式</b> ${esc(r.decided_by || "-")}</span>
      <span class="kv"><b>充分性</b> ${esc(logic.sufficiency ?? "-")}</span>
      <span class="kv"><b>门禁结论</b> ${esc(logic.verdict ?? "-")}</span>
      <span class="kv"><b>耗时</b> ${esc(r.elapsed_ms)} ms</span>
    </div>
    <div class="muted" style="margin-top:10px">冲突（定位到具体维度）</div>
    <ul class="reasons">${conf}</ul>
    ${pd ? `<details style="margin-top:6px"><summary class="muted">逐维判定</summary>
      <table style="margin-top:8px"><tr><th>维度</th><th>查询</th><th>候选</th><th>判定</th></tr>${pd}</table></details>` : ""}`;
}

function renderCandidates(cands, degradation) {
  if (!cands || !cands.length) {
    $("#candBox").innerHTML = degradation
      ? `<div class="empty">无候选。降级说明：${esc(degradation.reason)} — ${esc(degradation.note)}</div>`
      : '<div class="empty">无候选。</div>';
    return;
  }
  const rows = cands.map(c => {
    const p = c.profile_display || {};
    const prof = ["eye","lesion","location","severity","modality"].map(d => esc(p[d] || "—")).join(" · ");
    const src = c.source || {};
    return `<tr>
      <td class="num">#${esc(c.rank)}</td>
      <td><b>${esc(c.region_id)}</b><div class="muted">${esc(src.official_locator || "")}</div></td>
      <td class="num">${esc(c.score)}</td>
      <td class="num">${esc(c.retrieval_norm)}</td>
      <td class="num">${esc(c.consistency_score)}</td>
      <td>${prof}</td>
      <td class="muted">${esc(src.provenance_tier || "")}｜${esc(src.mask_path || "")}</td>
    </tr>`;
  }).join("");
  const deg = degradation ? `<div class="hint">⚠ 降级：${esc(degradation.reason)} — ${esc(degradation.note)}</div>` : "";
  $("#candBox").innerHTML = `
    <table><tr><th>名次</th><th>区域（可溯源锚点）</th><th>总分</th><th>检索分</th><th>一致性</th>
    <th>五维画像</th><th>溯源</th></tr>${rows}</table>${deg}`;
}

function renderEvidence(r) {
  const ev = r.evidence;
  const has = !!(ev && ev.html);
  $("#dlJson").disabled = !has; $("#dlHtml").disabled = !has;
  $("#fbAccept").disabled = !has; $("#fbReject").disabled = !has;
  if (!has) { $("#cardBox").innerHTML = '<div class="empty">本次无证据卡（例如质检未通过或输入为空）。</div>'; return; }
  const f = $("#cardBox").querySelector("iframe");
  if (f) { f.srcdoc = ev.html; }
  else {
    const ifr = document.createElement("iframe");
    ifr.srcdoc = ev.html; ifr.setAttribute("title", "证据卡");
    $("#cardBox").innerHTML = ""; $("#cardBox").appendChild(ifr);
  }
  const p = ev.provenance || {};
  $("#fbMsg").textContent = `trace ${p.trace_id || "-"} ｜ threshold ${p.threshold_ver} ｜ rule ${p.rule_ver}`;
}

function renderTrace(r) {
  const steps = r.steps || [];
  if (!steps.length) { $("#traceBox").innerHTML = '<div class="empty">无留痕。</div>'; return; }
  const g = r.guards || {};
  const head = `<div class="kvs" style="margin-bottom:10px">
     <span class="kv"><b>trace_id</b> ${esc(r.trace_id)}</span>
     <span class="kv"><b>步数</b> ${esc(g.steps_used)}/${esc(g.steps_limit)}</span>
     <span class="kv"><b>字符预算</b> ${esc(g.chars_used)}/${esc(g.chars_limit)}</span>
     <span class="kv"><b>总耗时</b> ${esc(r.elapsed_ms)} ms</span>
     <span class="kv"><b>保险触发</b> ${esc(g.truncated ? "是" : "否")}</span></div>`;
  const body = steps.map(s => `<div class="step"><span class="sk">[${esc(s.seq)}] ${esc(s.kind)}</span>
     <span class="sn">${esc(s.name)}</span>
     <span class="muted">${esc(s.duration_ms == null ? "" : s.duration_ms + "ms")} · ${esc(s.elapsed_ms)}ms 累计</span></div>`).join("");
  $("#traceBox").innerHTML = head + body;
}

async function run() {
  const btn = $("#runBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>运行中…';
  try {
    const r = await api("/api/run", {query_text: $("#q").value, image_path: $("#img").value.trim() || null});
    LAST = r;
    renderQc(r.qc); renderDecision(r); renderCandidates(r.candidates, r.degradation); renderEvidence(r); renderTrace(r);
  } catch (e) {
    alert("请求失败：" + e);
  } finally {
    btn.disabled = false; btn.textContent = "运行决策";
  }
}

function download(name, text, type) {
  const blob = new Blob([text], {type: type || "application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function feedback(verdict) {
  if (!LAST || !LAST.evidence) return;
  const caseId = (LAST.candidates && LAST.candidates[0] && LAST.candidates[0].region_id) || "UNKNOWN";
  const res = await api("/api/feedback", {case_id: caseId, verdict: verdict, note: "界面标记",
                                          trace_id: LAST.trace_id});
  $("#fbMsg").textContent = res.ok
    ? (res.duplicate ? `已存在，未重复写入（${res.record_id}）` : `已写入隔离区（${res.record_id}）`)
    : `失败：${res.error && res.error.message}`;
}

$("#runBtn").onclick = run;
$("#q").addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run(); });
$("#dlJson").onclick = () => LAST && LAST.evidence && download(`证据卡_${LAST.trace_id}.json`, JSON.stringify(LAST.evidence, null, 2));
$("#dlHtml").onclick = () => LAST && LAST.evidence && download(`证据卡_${LAST.trace_id}.html`, LAST.evidence.html, "text/html;charset=utf-8");
$("#fbAccept").onclick = () => feedback("ACCEPT");
$("#fbReject").onclick = () => feedback("REJECT");
boot();
</script>
</body>
</html>
