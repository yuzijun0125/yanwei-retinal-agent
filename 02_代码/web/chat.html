<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>眼维 · 病例检索对话</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1b304b;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:920px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;margin:0}p{margin:8px 0}.note{color:#596c80;font-size:14px}#messages{min-height:260px;margin:24px 0}.bubble{background:white;border:1px solid #dce5ef;border-radius:12px;padding:16px 20px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#e6f0fd;margin-left:15%}.role{font-size:12px;color:#61758c;display:block;margin-bottom:6px}form{background:white;border:1px solid #dce5ef;padding:16px;border-radius:12px}textarea{width:100%;resize:vertical;min-height:85px;padding:12px;font:inherit;border:1px solid #b9cada;border-radius:7px}button,.file{font:inherit;border:1px solid #b9cada;background:white;border-radius:7px;padding:8px 16px;cursor:pointer}button[type=submit]{background:#175fc3;color:white;border-color:#175fc3}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}a{color:#175fc3}#preview{max-width:180px;max-height:130px;border-radius:8px;margin-top:10px}#status{color:#8a3918;min-height:26px}details{margin-top:10px;font-size:14px}li{margin:5px 0}.file input{display:none}

</style><main><header><h1>眼维 · 病例检索</h1><button id="reset" type="button">新建会话</button></header><p class="note">直接说“左眼”也可以，我会继续询问。支持上传眼底图片，候选病例用于研究与演示，需人工复核。</p><a href="/">打开流程调试台</a><div id="messages" aria-live="polite"></div><form id="form"><textarea id="text" aria-label="描述或补充信息" placeholder="例如：左眼，黄斑区有硬性渗出"></textarea><img id="preview" hidden alt="已上传眼底图像"><div class="actions"><label class="file">上传图片<input id="file" type="file" accept="image/jpeg,image/png,image/tiff,image/webp"></label><button type="submit">发送</button><span class="note" id="filename">图片不超过8MB</span></div></form><p id="status" role="status"></p></main>
