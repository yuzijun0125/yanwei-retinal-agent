<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>眼维知识图谱 · 简明浏览版</title>
<style>
:root{font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#19394a;background:#f4f7f9;font-size:15px;line-height:1.65;--teal:#007c82;--border:#dbe5ea}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:white;border:1px solid var(--border);border-radius:7px;padding:9px 14px;line-height:1.5}button:hover{border-color:var(--teal);background:#edf8f7}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #45a8af;outline-offset:3px}button:disabled{opacity:.45;cursor:default}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:22px}h3{font-size:17px}a{color:var(--teal)}header{background:white;border-bottom:1px solid var(--border)}.top{max-width:1240px;margin:auto;padding:22px 26px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:13px;color:#587282}.top p{color:#587282;margin-top:5px;font-size:14px}.version{font-size:12px;color:#587282;white-space:nowrap}.shell{max-width:1240px;margin:auto;padding:20px 26px 50px}.notice{font-size:13px;padding:10px 14px;background:#fff6df;border-left:3px solid #d2a641;color:#79591c}.tabs{display:flex;gap:6px;margin:22px 0;border-bottom:1px solid var(--border)}.tabs button{background:transparent;border:0;border-radius:0;padding:12px 20px;border-bottom:3px solid transparent}.tabs button[aria-selected=true]{border-bottom-color:var(--teal);color:var(--teal);font-weight:700}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.muted{color:#607b8a;font-size:14px}.intro p{margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}input,select{padding:10px 12px;background:white;border:1px solid #b9cbd6;border-radius:6px;min-width:0}input{flex:1;min-width:180px}.workspace{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.panel{background:white;border:1px solid var(--border);border-radius:10px;min-width:0}.panel-head{padding:16px 18px;border-bottom:1px solid var(--border)}.items{padding:8px;max-height:560px;overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-radius:6px;margin-bottom:3px;padding:10px 12px;overflow-wrap:anywhere}.item small{display:block;font-size:12px;color:#607b8a}.item[aria-current=true]{background:#e5f4f2;color:#006f76}.content{padding:22px}.tag{font-size:12px;padding:3px 8px;background:#e5f4f2;color:#00737b;border-radius:4px;display:inline-block}.warning{background:#fff3d8;color:#875b1b}.selected-title{display:flex;align-items:start;justify-content:space-between;gap:12px}.selected-title h3{font-size:20px;overflow-wrap:anywhere}.summary{margin:8px 0 18px}.relation-list{display:grid;gap:10px}.relation-row{border:1px solid var(--border);border-radius:8px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 136px minmax(0,1fr) 88px;gap:12px;align-items:center}.entity{border:0;background:#edf5f8;text-align:left;padding:10px 12px;overflow-wrap:anywhere;width:100%;height:auto}.entity small{display:block;font-size:12px;color:#607b8a}.relation{color:#497280;text-align:center;font-size:13px;overflow-wrap:anywhere}.relation:after{content:'⟶';display:block;font-size:23px;line-height:1.2;color:#8cabb7}.source{font-size:13px;padding:8px}.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}.pager span{font-size:13px;color:#607b8a}.empty{padding:35px 18px;text-align:center;color:#607b8a}.help{margin-top:20px;font-size:13px;color:#607b8a}.query-box{background:#edf7f6;border:1px solid #c9e4df;border-radius:8px;padding:16px;margin-bottom:20px}.query-box p{font-size:13px;margin:5px 0 10px}.query-box button{color:var(--teal)}.result-info{margin-bottom:15px}.result-item{margin-bottom:10px;padding:14px;border:1px solid var(--border);border-radius:8px}.result-item button{margin-top:8px}.result-item p{font-size:13px;color:#607b8a;overflow-wrap:anywhere}.details{margin-top:20px;border-top:1px solid var(--border);padding-top:14px}.details summary{cursor:pointer;color:#607b8a;font-size:13px}.properties{font-size:13px;overflow-wrap:anywhere;max-height:320px;overflow:auto}.properties p{margin:8px 0}.text-record{padding:14px;background:#f4f7f9;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.info{padding:13px;background:#f4f7f9;font-size:13px;color:#607b8a;margin-top:12px}dialog{width:min(680px,calc(100% - 28px));max-height:85vh;border:1px solid var(--border);border-radius:12px;padding:24px;color:#19394a;overflow:auto}dialog::backdrop{background:#152d3f88}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.evidence{border-top:1px solid var(--border);margin-top:15px;padding-top:15px;overflow-wrap:anywhere}.evidence p{margin:8px 0}.evidence small{color:#607b8a}.footer{margin-top:24px;border-top:1px solid var(--border);padding-top:16px;font-size:12px;color:#607b8a;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}[hidden]{display:none!important}
@media(max-width:1000px){.workspace{grid-template-columns:210px minmax(0,1fr)}.relation-row{grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr)}.source{grid-column:1/-1;justify-self:end}.content{padding:16px}}
@media(max-width:680px){.top,.shell{padding:16px}.version{display:none}.workspace{grid-template-columns:1fr}.items{max-height:190px}.intro{display:block}.tabs button{padding:11px 12px}.relation-row{grid-template-columns:1fr;gap:5px}.relation{display:flex;align-items:center;justify-content:center;gap:10px}.relation:after{content:'↓';font-size:20px}.source{grid-column:auto;justify-self:stretch}.content{padding:15px}.selected-title{display:block}.selected-title .tag{margin-top:8px}.toolbar select{width:100%}.toolbar input{width:100%}.intro h2{font-size:20px}.footer button{width:100%}}
</style></head><body>
<header><div class="top"><div><div class="brand">眼维 / 资料与知识</div><h1>知识图谱</h1><p>选一个概念或病例，看它关联什么，再查看资料出处。</p></div><span class="version">简明浏览版 · 离线可用</span></div></header>
<main class="shell"><div class="notice">研究原型：资料关联及医学概念尚未经专家审核，不能据此诊断。图片节点暂提供记录信息，不含原图预览。</div>
<nav class="tabs" role="tablist" aria-label="浏览内容"><button role="tab" id="basicTab" aria-selected="true">基础知识</button><button role="tab" id="caseTab" aria-selected="false">参考病例</button><button role="tab" id="reviewTab" aria-selected="false">待复核</button></nav>
<div class="intro"><div><h2 id="pageTitle"></h2><p class="muted" id="pageHint"></p></div><button id="reset">回到初始页面</button></div>
<div class="query-box" id="queryBox" hidden><h3>不知道从哪里开始？</h3><p>试查参考库中同时标注“出血”和项目位置“黄斑区”的病例。位置仍需复核。</p><button id="query">查黄斑区出血参考病例</button><button id="clearQuery" hidden>返回全部病例</button></div>
<div class="toolbar"><label for="search" class="muted">查找</label><input id="search" placeholder="输入名称或编号"><select id="filter" aria-label="筛选类别"></select></div>
<div class="workspace"><aside class="panel"><div class="panel-head"><h3 id="listTitle"></h3><p class="muted" id="listCount" aria-live="polite"></p></div><div class="items" id="items"></div></aside><section class="panel content" id="content" aria-label="关系详情"></section></div>
<p class="help">使用方法：① 左侧选择内容　② 中间查看关系　③ 点击“看来源”。点击关系中的名称可以继续浏览。</p>
<footer class="footer"><span id="counts"></span><button id="export">导出完整图谱数据</button></footer></main>
<dialog id="sourceDialog"><div class="dialog-head"><h2>这条关系的依据</h2><button id="closeDialog">关闭</button></div><div id="sourceContent"></div></dialog>
<script>
const G=__GRAPH_JSON__,nodes=new Map(G.nodes.map(n=>[n.id,n]));const $=id=>document.getElementById(id);
const names={CaseRecord:'病例记录',ImageAsset:'图片记录',RegionAnnotation:'标注区域',LesionConcept:'病灶',TextRecord:'文字记录',Disease:'疾病',Anatomy:'部位',Laterality:'推导眼别',SeverityDraft:'程度草案',Modality:'影像类型'};
const statuses={IMPORTED_PENDING:'导入记录 · 待审核',REVIEW_REQUIRED:'项目推导 · 待复核',MENTION_ONLY:'仅文字提及',SOURCE_BACKED_NOT_EXPERT_REVIEWED:'有文献出处 · 未经专家审核'};
let mode='basic',selected='disease:DR',page=0,caseSubset=null,reviewPage=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,fn,cls){const b=el('button',text,cls);b.type='button';b.onclick=fn;return b}
function label(n){if(n.type==='CaseRecord')return '参考病例 '+n.id.split('_').pop().replace(/^0+/,'');if(n.type==='ImageAsset')return '眼底图片 '+n.id.split('_').pop().replace(/^0+/,'');if(n.type==='RegionAnnotation')return '标注区域 '+n.id.replace('REG_IDRiD_','');if(n.type==='TextRecord')return '文字记录 '+n.id.replace('TXT_IDRiD_','');return n.label}
function setMode(next){mode=next;page=0;reviewPage=0;caseSubset=null;$('search').value='';for(const m of ['basic','case','review'])$(m+'Tab').setAttribute('aria-selected',m===mode?'true':'false');$('pageTitle').textContent={basic:'了解基础知识',case:'查看参考病例',review:'检查待复核关系'}[mode];$('pageHint').textContent={basic:'这里展示少量基础概念；病灶与疾病的关联不能单独用来确诊。',case:'81条项目病例记录，按图片组织，不代表81名已确认患者。',review:'这些字段由项目规则推导，请回到原始资料核对；此页只浏览，不保存审核意见。'}[mode];$('queryBox').hidden=mode!=='case';$('clearQuery').hidden=true;const select=$('filter');select.replaceChildren();const opts=mode==='basic'?[['','全部概念'],['Disease','疾病'],['LesionConcept','病灶'],['Anatomy','部位']]:mode==='case'?[['','全部病例']]:[['','全部推导关系'],['PROJECT_LOCATION','位置'],['PROJECT_EYE','眼别'],['PROJECT_SEVERITY','程度']];for(const [v,t]of opts){const o=el('option',t);o.value=v;select.append(o)}selected=mode==='case'?'CASE_IDRiD_000055':'disease:DR';renderList();if(mode!=='review')showNode(selected);else renderReview()}
function renderList(){const q=$('search').value.trim().toLowerCase(),type=$('filter').value;const box=$('items');box.replaceChildren();if(mode==='review'){renderReview();return}let found=G.nodes.filter(n=>mode==='case'?n.type==='CaseRecord'&&(!caseSubset||caseSubset.has(n.id)):['Disease','LesionConcept','Anatomy'].includes(n.type));found=found.filter(n=>(!type||n.type===type)&&(!q||(n.label+' '+n.id+' '+label(n)).toLowerCase().includes(q)));$('listTitle').textContent=mode==='case'?'病例列表':'概念列表';$('listCount').textContent='共 '+found.length+' 项';if(!found.length)box.append(el('p','没有找到，请更换关键词或清除筛选。','empty'));for(const n of found){const b=button(label(n),()=>showNode(n.id),'item');b.dataset.id=n.id;b.append(el('small',names[n.type]+' · '+n.id));b.setAttribute('aria-current',n.id===selected?'true':'false');box.append(b)}}
function entity(id){const n=nodes.get(id);const b=button(label(n),()=>showNode(id),'entity');b.append(el('small',names[n.type]));return b}
function row(edge){const r=el('div',undefined,'relation-row');r.append(entity(edge.source),el('span',edge.label,'relation'),entity(edge.target),button('看来源',()=>source(edge),'source'));return r}
function pager(total,current,change){const pages=Math.max(1,Math.ceil(total/6)),nav=el('div',undefined,'pager'),prev=button('上一页',()=>change(current-1)),next=button('下一页',()=>change(current+1));prev.disabled=current===0;next.disabled=current>=pages-1;nav.append(prev,el('span',`第 ${current+1} / ${pages} 页 · 共 ${total} 条关系`),next);return nav}
function showNode(id,p=0){const n=nodes.get(id);if(!n)return;selected=id;page=p;const all=G.edges.filter(e=>e.source===id||e.target===id),box=$('content');box.replaceChildren();const heading=el('div',undefined,'selected-title');heading.append(el('h3',label(n)),el('span',names[n.type],'tag'));box.append(heading,el('p',`共 ${all.length} 条直接关系。下方从左往右读：某个对象 → 关系 → 另一个对象。`,'muted summary'));
if(n.type==='ImageAsset')box.append(el('p','当前离线包仅有图片记录和标注信息，没有附带原始图片，暂不能预览。','info'));
if(n.type==='TextRecord')box.append(el('p',n.properties.text||'此记录没有正文。','text-record'),el('p','来源文字可能为项目合成内容，不能当成真实临床报告。','info'));
const list=el('div',undefined,'relation-list');for(const edge of all.slice(p*6,p*6+6))list.append(row(edge));if(!all.length)list.append(el('p','暂时没有关联资料。','empty'));box.append(list,pager(all.length,p,next=>showNode(id,next)));
const detail=el('details',undefined,'details');detail.append(el('summary','查看记录编号和原始字段'));const props=el('div',undefined,'properties');props.append(el('p','记录编号：'+n.id));for(const[k,v]of Object.entries(n.properties||{})){if(v!==null&&v!=='')props.append(el('p',k+'：'+(typeof v==='object'?JSON.stringify(v):v)))}detail.append(props);box.append(detail);for(const b of document.querySelectorAll('.item'))b.setAttribute('aria-current',b.dataset.id===id?'true':'false')}
function source(edge){const box=$('sourceContent');box.replaceChildren(el('p',label(nodes.get(edge.source))+' → '+edge.label+' → '+label(nodes.get(edge.target))),el('span',statuses[edge.status]||edge.status,'tag warning'));for(const ev of edge.evidence){const d=el('div',undefined,'evidence');d.append(el('p',ev.document||'来源记录'),el('small',ev.locator),el('p',ev.excerpt));if(ev.transform)d.append(el('p','处理方式：'+ev.transform,'muted'));if(ev.note)d.append(el('p',ev.note,'muted'));if(ev.url&&/^https?:\/\//.test(ev.url)){const a=el('a','打开原始文献');a.href=ev.url;a.target='_blank';a.rel='noopener noreferrer';d.append(a)}const extra=el('details');extra.append(el('summary','查看技术字段'),el('p',JSON.stringify(ev,null,2),'properties'));d.append(extra);box.append(d)}$('sourceDialog').showModal()}
function renderReview(){const q=$('search').value.trim().toLowerCase(),type=$('filter').value;const edges=G.edges.filter(e=>e.status==='REVIEW_REQUIRED'&&(!type||e.relation===type)&&(!q||(nodes.get(e.source).label+' '+e.label+' '+nodes.get(e.target).label+' '+e.source).toLowerCase().includes(q)));$('listTitle').textContent='复核说明';$('listCount').textContent=edges.length+' 条匹配关系';$('items').replaceChildren(el('p','这里列出位置、眼别和程度的项目推导。点击“看来源”检查依据；审核结果暂不能在此保存。','info'));const box=$('content');box.replaceChildren(el('h3','待复核关系'),el('p','631是明确标记为推导的关系数；其他导入或提及关系同样不等于审核通过。','muted summary'));const list=el('div',undefined,'relation-list');for(const edge of edges.slice(reviewPage*6,reviewPage*6+6))list.append(row(edge));if(!edges.length)list.append(el('p','没有匹配关系，请更换筛选条件。','empty'));box.append(list,pager(edges.length,reviewPage,next=>{reviewPage=next;renderReview()}))}
function runQuery(){const bleed=new Set(G.edges.filter(e=>e.relation==='ANNOTATED_AS'&&e.target==='lesion:HE').map(e=>e.source)),location=new Set(G.edges.filter(e=>e.relation==='PROJECT_LOCATION'&&e.target==='anatomy:MACULA').map(e=>e.source));const regions=new Set([...bleed].filter(x=>location.has(x))),images=new Set(G.edges.filter(e=>e.relation==='HAS_REGION'&&regions.has(e.target)).map(e=>e.source));caseSubset=new Set(G.edges.filter(e=>e.relation==='HAS_IMAGE'&&images.has(e.target)).map(e=>e.source));$('search').value='';$('clearQuery').hidden=false;renderList();const box=$('content');box.replaceChildren(el('h3','找到 '+caseSubset.size+' 条参考病例'),el('p','条件来自同一个标注区域：已有标注为出血，且项目推导位置为黄斑区。位置尚未审核，结果不能用于确诊。','muted summary'));for(const id of [...caseSubset].slice(0,6)){const d=el('div',undefined,'result-item');d.append(el('h3',label(nodes.get(id))),el('p',id),button('查看病例关系',()=>showNode(id)));box.append(d)}box.append(el('p','更多匹配病例请在左侧列表选择。','muted'))}
for(const m of ['basic','case','review'])$(m+'Tab').onclick=()=>setMode(m);$('search').oninput=()=>{reviewPage=0;renderList()};$('filter').onchange=()=>{reviewPage=0;renderList()};$('reset').onclick=()=>setMode('basic');$('query').onclick=runQuery;$('clearQuery').onclick=()=>setMode('case');$('closeDialog').onclick=()=>$('sourceDialog').close();$('sourceDialog').onclick=e=>{if(e.target===$('sourceDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(G,null,2)],{type:'application/json'}));a.href=u;a.download='yanwei-graph.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('counts').textContent=`图谱数据：${G.nodes.length} 个节点 / ${G.edges.length} 条关系 · 规则原型，尚未接入 Nexent`;setMode('basic');
</script></body></html>
